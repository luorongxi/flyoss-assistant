[tool.poetry]
name = "flyoss-assistant"
version = "0.1.0"
description = "DingTalk AI Assistant with advanced agent capabilities"
authors = ["Your Name <your.email@example.com>"]
license = "Apache 2.0"
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.12"
flask = "^3.0.0"
flask-restx = "^1.3.0"
aiohttp = "3.12.14"
asgiref = "^3.8.0"
uvicorn = "^0.29.0"
gunicorn = "23.0.0"
pydantic = "^2.7.1"
pydantic-settings = "^2.2.1"
langgraph = "^0.5.0"
langchain = "0.3.19"
langchain-core = "0.3.36"
langchain-community = "0.3.1"
google-search-results = "2.4.2"
dingtalk-stream = "^0.24.0"
dingtalkchatbot = "1.5.7"
redis = "^5.0.0"
qdrant-client = "^1.9.0"
openai = "^1.30.2"  # 兼容硅基流动API
langsmith = "^0.1.31"
loguru = "^0.7.2"
python-dotenv = "^1.0.1"
requests = "^2.31.0"
jinja2 = "^3.1.3"
httpx = "^0.27.0"
tenacity = "^8.2.3"
beautifulsoup4 = "^4.12.3"
tiktoken = "^0.6.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.1.1"
pytest-mock = "^3.14.0"
pytest-asyncio = "^0.23.5"
ipython = "^8.22.2"
flake8 = "^7.0.0"
black = "^24.3.0"
mypy = "^1.9.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--cov=app --cov-report=term-missing"

[tool.black]
line-length = 120
target-version = ['py312']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | build
  | dist
)/
'''

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_generics = true
check_untyped_defs = true